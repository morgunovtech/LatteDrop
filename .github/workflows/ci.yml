name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Public repos get GitHub secret scanning, but a push protection miss or an
  # old commit still slips through; gitleaks scans the whole history on every
  # run. Add build and test jobs once there is code (Swift: `xcodebuild test`
  # on a macos runner).
  secrets:
    name: secrets
    # The action lists the PR's commits through the API; the default token
    # cannot read pull requests.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
